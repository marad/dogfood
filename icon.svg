<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Background -->
  <rect width="512" height="512" rx="80" fill="#fff7ed"/>

  <!-- Ears (tan/brown floppy) -->
  <ellipse cx="148" cy="230" rx="68" ry="90" fill="#c8843a" transform="rotate(-15 148 230)"/>
  <ellipse cx="364" cy="230" rx="68" ry="90" fill="#c8843a" transform="rotate(15 364 230)"/>

  <!-- Head (white) -->
  <ellipse cx="256" cy="255" rx="150" ry="145" fill="#ffffff"/>

  <!-- Brown patch over left eye -->
  <ellipse cx="192" cy="205" rx="58" ry="48" fill="#c8843a"/>

  <!-- Eyes -->
  <circle cx="192" cy="210" r="28" fill="#2a1a0a"/>
  <circle cx="316" cy="210" r="28" fill="#2a1a0a"/>
  <circle cx="200" cy="202" r="9" fill="#ffffff"/>
  <circle cx="324" cy="202" r="9" fill="#ffffff"/>
  <circle cx="204" cy="205" r="4" fill="#ffffff"/>
  <circle cx="328" cy="205" r="4" fill="#ffffff"/>

  <!-- Muzzle (white) -->
  <ellipse cx="256" cy="320" rx="80" ry="60" fill="#f5f0eb"/>

  <!-- Nose -->
  <ellipse cx="256" cy="295" rx="28" ry="18" fill="#1a1a1a"/>
  <ellipse cx="248" cy="290" rx="8" ry="5" fill="#444" opacity="0.5"/>

  <!-- Mouth -->
  <path d="M230 325 Q256 345 282 325" stroke="#888" stroke-width="3" fill="none" stroke-linecap="round"/>

  <!-- Chin patch (tan) -->
  <ellipse cx="256" cy="365" rx="45" ry="28" fill="#c8843a"/>

  <!-- Inner ears -->
  <ellipse cx="150" cy="232" rx="42" ry="62" fill="#e8a86a" transform="rotate(-15 150 232)"/>
  <ellipse cx="362" cy="232" rx="42" ry="62" fill="#e8a86a" transform="rotate(15 362 232)"/>
</svg>
