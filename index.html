<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Miska — ile nałożyć psu</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#c8843a">
<style>
  :root {
    --bg: #faf6f0;
    --card: #ffffff;
    --accent: #b5651d;
    --text: #2d2a26;
    --muted: #8a8378;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: system-ui, -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    justify-content: center;
    padding: 1rem;
  }
  main { width: 100%; max-width: 28rem; }
  h1 { font-size: 1.3rem; margin: 0.5rem 0 1rem; }
  h2 { font-size: 1.1rem; margin: 1.25rem 0 0.75rem; color: var(--muted); font-weight: 500; }
  .screen { display: none; }
  .screen.active { display: block; }
  .food-btn {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    width: 100%;
    background: var(--card);
    border: 1px solid #eee5d8;
    border-radius: 1rem;
    padding: 1.25rem 1.25rem;
    margin-bottom: 0.75rem;
    font-size: 1.4rem;
    font-weight: 600;
    color: var(--text);
    cursor: pointer;
    box-shadow: 0 1px 4px rgba(0,0,0,0.08);
    text-align: left;
  }
  .food-btn:active { background: #f3ead9; }
  .food-btn .grams { color: var(--accent); white-space: nowrap; }
  .food-btn .grams small { font-size: 1rem; font-weight: 400; color: var(--muted); }
  input {
    width: 100%;
    font-size: 1.8rem;
    padding: 0.75rem;
    border: 1px solid #ddd5c8;
    border-radius: 0.75rem;
    background: #fff;
    text-align: center;
  }
  .back-btn {
    background: none;
    border: none;
    color: var(--accent);
    font-size: 1rem;
    padding: 0.5rem 0;
    cursor: pointer;
    margin-bottom: 0.5rem;
  }
  .context {
    background: #f3ead9;
    border-radius: 0.75rem;
    padding: 0.75rem 1rem;
    font-size: 1rem;
    margin-bottom: 1rem;
  }
  .result {
    text-align: center;
    font-size: 4rem;
    font-weight: 700;
    color: var(--accent);
    margin: 1.5rem 0 0.5rem;
  }
  .result small { font-size: 1.5rem; font-weight: 400; color: var(--muted); }
  .sub { text-align: center; color: var(--muted); font-size: 1.1rem; margin: 0 0 2rem; }
  .restart-btn {
    display: block;
    width: 100%;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 1rem;
    padding: 1rem;
    font-size: 1.2rem;
    cursor: pointer;
  }
  .error { color: #b00020; text-align: center; }
  footer { text-align: center; color: var(--muted); font-size: 0.8rem; margin-top: 1.5rem; }
</style>
</head>
<body>
<main>
  <!-- Screen 1: food list -->
  <section id="screen-list" class="screen active">
    <h1>🐕 Co dajesz do miski?</h1>
    <div id="foodList"></div>
    <footer>porcje na 1 posiłek · pies <span id="dogWeight">?</span> kg · dane: <code>foods.json</code></footer>
  </section>

  <!-- Screen 2: how much already given + second food -->
  <section id="screen-mix" class="screen">
    <button class="back-btn" id="backToList">← wróć</button>
    <div class="context" id="mixContext"></div>
    <h2>Ile gramów nałożyłeś?</h2>
    <input id="givenGrams" type="number" inputmode="numeric" min="0">
    <h2>Którą puszkę teraz nakładasz?</h2>
    <div id="secondFoodList"></div>
  </section>

  <!-- Screen 3: result -->
  <section id="screen-result" class="screen">
    <div class="context" id="resultContext"></div>
    <p class="result" id="resultGrams"></p>
    <p class="sub" id="resultLabel"></p>
    <button class="restart-btn" id="restart">Od początku</button>
  </section>
</main>

<script>
let config = null;
let firstFood = null;

function dailyDose(food, weightKg) {
  const table = food.dosage;
  const first = table[0];
  const last = table[table.length - 1];
  if (weightKg <= first.minKg) return first.minG;
  if (weightKg >= last.maxKg) return last.maxG;
  const bracket = table.find(b => weightKg >= b.minKg && weightKg <= b.maxKg);
  const t = (weightKg - bracket.minKg) / (bracket.maxKg - bracket.minKg);
  return bracket.minG + t * (bracket.maxG - bracket.minG);
}

function mealPortion(food) {
  return dailyDose(food, config.dogWeightKg) / config.mealsPerDay;
}

function show(screenId) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(screenId).classList.add('active');
}

function foodButton(food, onClick) {
  const btn = document.createElement('button');
  btn.className = 'food-btn';
  btn.innerHTML = `<span>${food.name}</span>` +
    `<span class="grams">${Math.round(mealPortion(food))} <small>g</small></span>`;
  btn.addEventListener('click', onClick);
  return btn;
}

function remainingGrams(secondFood) {
  const given = parseFloat(document.getElementById('givenGrams').value) || 0;
  const coveredFraction = given / mealPortion(firstFood);
  return Math.max(0, (1 - coveredFraction) * mealPortion(secondFood));
}

function updateSecondList() {
  document.querySelectorAll('#secondFoodList .food-btn').forEach((btn, i) => {
    const food = config.foods[i];
    btn.querySelector('.grams').innerHTML =
      Math.round(remainingGrams(food)) + ' <small>g</small>';
  });
}

function openMixScreen(food) {
  firstFood = food;
  document.getElementById('mixContext').textContent =
    `W misce: ${food.name} (pełna porcja: ${Math.round(mealPortion(food))} g)`;
  document.getElementById('givenGrams').value = '';
  updateSecondList();
  show('screen-mix');
  document.getElementById('givenGrams').focus();
}

function showResult(secondFood) {
  const given = parseFloat(document.getElementById('givenGrams').value) || 0;
  const coveredFraction = given / mealPortion(firstFood);
  const remaining = remainingGrams(secondFood);
  document.getElementById('resultContext').textContent =
    `${given} g „${firstFood.name}” + „${secondFood.name}”`;
  if (coveredFraction >= 1) {
    document.getElementById('resultGrams').textContent = '0';
    document.getElementById('resultLabel').textContent =
      'porcja już pokryta — nic nie dokładaj';
  } else {
    document.getElementById('resultGrams').innerHTML =
      Math.round(remaining) + ' <small>g</small>';
    document.getElementById('resultLabel').textContent =
      `tyle dołóż karmy „${secondFood.name}”`;
  }
  show('screen-result');
}

async function init() {
  try {
    const res = await fetch('foods.json');
    if (!res.ok) throw new Error('HTTP ' + res.status);
    config = await res.json();
  } catch (e) {
    document.querySelector('main').innerHTML =
      '<p class="error">Nie udało się wczytać foods.json (' + e.message + ').<br>' +
      'Lokalnie uruchom przez serwer, np. <code>python3 -m http.server</code>.</p>';
    return;
  }
  document.getElementById('dogWeight').textContent = config.dogWeightKg;
  const list = document.getElementById('foodList');
  const secondList = document.getElementById('secondFoodList');
  for (const food of config.foods) {
    list.appendChild(foodButton(food, () => openMixScreen(food)));
    secondList.appendChild(foodButton(food, () => showResult(food)));
  }
  document.getElementById('givenGrams').addEventListener('input', updateSecondList);
  document.getElementById('backToList').addEventListener('click', () => show('screen-list'));
  document.getElementById('restart').addEventListener('click', () => show('screen-list'));
}

init();
</script>
<script>
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js');
</script>
</body>
</html>
